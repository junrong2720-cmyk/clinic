<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中医诊疗系统</title>
<meta name="theme-color" content="#202A32">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 布局：左侧墨色导航 + 右侧宣纸工作区；接诊页为「病历表单 + 常驻辨证参考栏」双栏 */
:root{
  --paper:#F4F0E6; --surface:#FFFDF8; --ink:#202A32; --ink2:#55626B; --ink3:#8C959B;
  --line:#DAD3C2; --line2:#EAE4D5;
  --dai:#3E5866; --dai-d:#2C414D; --dai-l:#E3EAED;
  --zhu:#B8403F; --zhu-l:#F7E5E2;
  --ok:#3F7355; --ok-l:#E2EEE6; --warn:#8F640E; --warn-l:#FAF0D6;
  --f-body:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --f-kai:"KaiTi","STKaiti","Kaiti SC","Microsoft YaHei",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.65 var(--f-body);color:var(--ink);background:var(--paper)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--dai);outline-offset:2px}

.app{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:100%}
.side{background:var(--ink);color:#E8E3D6;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;flex:none;white-space:nowrap}
.seal{width:36px;height:36px;border-radius:6px;background:var(--zhu);color:#FBEFE6;font:22px/36px var(--f-kai);text-align:center;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.08em}
.brand small{color:#9BA6AD;font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:#C6CCD0;text-decoration:none;padding:9px 12px;border-radius:5px;font-size:14px;letter-spacing:.04em}
.nav a:hover{background:#2C3842;color:#fff}
.nav a.on{background:var(--dai);color:#fff}
.side-lock{background:none;border:1px solid #47545E;color:#C6CCD0;border-radius:5px;padding:6px 12px;cursor:pointer;margin:0 6px;flex:none}
.side-lock:hover{background:#2C3842;color:#fff}
.side-sync{font-size:12px;color:#9BB5A4;padding:0 6px;flex:none}
.side-sync.err{color:#E9A39C}
.locked .app{display:none}
.lock{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;padding:16px;z-index:40}
.lock-box{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,100%);text-align:center}
.lock-box .seal{width:56px;height:56px;font-size:34px;line-height:56px;border-radius:8px}
.lock-box h1{font-size:20px;letter-spacing:.08em}
.lock-box input{text-align:center}
.lock-box .btn{width:100%}
.lock-err{color:var(--zhu);min-height:1.6em;font-size:13px;margin-top:8px}
.side .fine{margin-top:auto;font-size:11px;line-height:1.6;color:#8D989F;padding:0 6px}

main{padding:26px 30px 60px;min-width:0;max-width:1320px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.head h1{font-size:22px;letter-spacing:.06em}
.sub{color:var(--ink2);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--dai);color:var(--dai-d)}
.btn.primary{background:var(--dai);border-color:var(--dai);color:#fff}
.btn.primary:hover{background:var(--dai-d);color:#fff}
.btn.danger{color:var(--zhu);border-color:#E2B9B4}
.btn.danger:hover{background:var(--zhu-l);border-color:var(--zhu)}
.btn.sm{padding:3px 10px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--dai);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

input[type=text],input[type=password],input[type=search],input[type=number],input[type=date],input[type=datetime-local],input[type=tel],select,textarea{
  border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--dai-l);border-color:var(--dai)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
label.f.req>span::after{content:" *";color:var(--zhu)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:16px;min-width:0}
.card>h2{font-size:15px;letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.step{font:15px var(--f-kai);color:var(--zhu);border:1px solid var(--zhu);border-radius:3px;width:22px;height:22px;display:inline-grid;place-items:center}
.sum{color:var(--ink2);margin-bottom:16px;font-variant-numeric:tabular-nums}
.sum b{color:var(--ink);font-size:18px;margin:0 2px}
.sum i{display:inline-block;width:1px;height:12px;background:var(--line);margin:0 14px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:5px;margin-bottom:14px;background:var(--warn-l);color:var(--warn);border:1px solid #E8D7A6}
.banner.info{background:var(--dai-l);color:var(--dai-d);border-color:#C7D4DA}
.empty{color:var(--ink3);padding:22px 0;text-align:center}

.tw{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.list th{font-weight:400;font-size:12px;color:var(--ink3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.list tr[data-act]{cursor:pointer}
table.list tr[data-act]:hover td{background:#FAF6EA}
.tag{display:inline-block;font-size:11px;line-height:18px;padding:0 6px;border-radius:3px;background:var(--dai-l);color:var(--dai-d);white-space:nowrap}
.tag.zhu{background:var(--zhu-l);color:var(--zhu)}
.tag.gray{background:var(--line2);color:var(--ink2)}
.muted{color:var(--ink3)}
.nowrap{white-space:nowrap}

dl.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 24px;margin:0}
dl.info div{min-width:0}
dl.info dt{font-size:12px;color:var(--ink3)}
dl.info dd{margin:0;word-break:break-word}
.allergy{color:var(--zhu);font-weight:700}

/* 接诊 */
.consult{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 18px;align-items:start}
.consult>*{grid-column:1}
.consult>.sg-col{grid-column:2;grid-row:1/span 9;align-self:stretch}
.consult.nofour{grid-template-columns:minmax(0,1fr);max-width:920px}
.chip.was{box-shadow:inset 0 -2px 0 var(--zhu)}
.prevc summary{cursor:pointer}
.prevc summary b{color:var(--zhu);margin-right:10px}
.prevc details[open] summary{margin-bottom:12px}
.prev-foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.prev-foot label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);white-space:nowrap}
.prev-foot select{width:auto}
.rx-add{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.rx-add:empty{display:none}
.rx-add-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start}
.phs{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:92px;height:92px;margin:0;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--line2);flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(32,42,50,.72);color:#fff;line-height:18px;cursor:pointer;padding:0}
.ph-x:hover{background:var(--zhu)}
.ph-add{display:grid;place-items:center;align-content:center;gap:2px;border-style:dashed;background:#fff;color:var(--ink2);cursor:pointer;font-size:22px;line-height:1.2;text-align:center}
.ph-add span{font-size:12px}
.ph-add:hover,.ph-add:focus-within{border-color:var(--dai);color:var(--dai-d)}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ph-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ph-cmp figure{margin:0;min-width:0}
.ph-cmp img{width:100%;max-height:60vh;object-fit:contain;background:#1b2228;border-radius:4px;display:block;min-height:120px}
.ph-cmp figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.ph-cmp figcaption b{color:var(--zhu)}
.ph-tl{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.ph-tl>div{flex:none;max-width:300px}
.ph-tl .cap{font-size:12px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.filt{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 16px;align-items:start}
table.list.stat{min-width:0}
table.stat .num{text-align:right}
.sg-wrap{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--dai);border-radius:6px;padding:14px 16px}
.sg-wrap>h2{font-size:15px;letter-spacing:.06em;margin-bottom:4px}
.ptbar{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
.ptbar .nm{font-size:18px;font-weight:700}
.ptbar label{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.ptbar input[type=datetime-local]{width:auto}
.sx-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.sx-row:last-of-type{border-bottom:0}
.sx-l{font-size:13px;color:var(--ink2);padding-top:3px}
.sx-row.key .sx-l{color:var(--zhu);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 9px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--dai)}
.chip.on{background:var(--dai);border-color:var(--dai);color:#fff}
.sg{padding:12px 0;border-top:1px solid var(--line2)}
.sg header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sg h3{font-size:15px}
.lv{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2)}
.lv.hi{color:var(--ok);font-weight:700}
.bar{height:4px;background:var(--line2);border-radius:2px;margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dai)}
.sg p{font-size:13px;line-height:1.7}
.sg p b{font-weight:400;color:var(--ink3);margin-right:6px}
.sg .miss{color:var(--warn)}
.sg-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fine{font-size:12px;color:var(--ink3);line-height:1.6}

.rx-cmd{display:flex;gap:8px}
.rx-cmd input{flex:1 1 auto;width:auto;padding:9px 12px;font-size:15px}
.rx-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rx-tools select{width:auto;flex:1 1 180px}
.rx-tools input{flex:2 1 240px;width:auto}
.rx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:6px 18px}
.rx-row{display:grid;grid-template-columns:20px minmax(0,1fr) 64px 52px 74px 26px 26px;gap:4px;align-items:center}
.rx-row .n{font-size:12px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.rx-row input,.rx-row select{padding:4px 6px}
.rx-row .x{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;padding:2px}
.rx-row .x{font-size:20px;height:30px}
.rx-row .x:hover{color:var(--zhu)}
.rx-row .x.add{color:var(--dai);font-weight:700}
.rx-row .x.add:hover{color:var(--dai-d)}
.rx-row.blank input{border-style:dashed;background:var(--surface)}
.rx-row.blank .n{color:var(--dai);font-weight:700}
.rx-more{margin-top:12px}
.rx-more summary{cursor:pointer;color:var(--ink2);font-size:13px}
.rx-more[open] summary{margin-bottom:8px}
@media (max-width:520px){
  .rx-grid{grid-template-columns:minmax(0,1fr)}
  .rx-row{grid-template-columns:minmax(0,1fr) 50px 44px 58px 26px 26px;gap:3px}
  .rx-row .n{display:none}
  .rx-row input,.rx-row select{padding:6px 4px;font-size:15px}
  .rx-row select{padding-right:0}
}
.rx-meta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.rx-meta label{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.rx-meta input[type=number]{width:64px}
.rx-meta .use{flex:1 1 260px}
.rx-total{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.warns{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.w{padding:7px 12px;border-radius:5px;font-size:13px;background:var(--warn-l);color:var(--warn)}
.w.danger{background:var(--zhu-l);color:var(--zhu);font-weight:700}
.savebar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* 病历查看 */
.rec h3{font-size:13px;color:var(--ink3);font-weight:400;margin:14px 0 2px}
.rec h3:first-child{margin-top:0}
.rec p{white-space:pre-wrap;word-break:break-word}
.herbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;margin:6px 0;font-variant-numeric:tabular-nums}
.herbs span small{color:var(--zhu);margin-left:3px}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line2);cursor:pointer}
.tl-i:first-child{border-top:0}
.tl-i:hover{background:#FAF6EA}
.tl-d{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}

/* 知识库 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 16px;text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--dai-d);border-color:var(--dai);font-weight:700}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.lib .card{margin:0}
.lib h3{font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.lib h3 small{font-weight:400;color:var(--ink3);font-size:12px}
.lib p{font-size:13px;margin-top:4px}
.lib p b{font-weight:400;color:var(--ink3);margin-right:6px}

.modal{position:fixed;inset:0;background:rgba(32,42,50,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal-box{background:var(--surface);border-radius:8px;padding:22px 24px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-box h2{font-size:17px;margin-bottom:14px}
.modal-box .acts{justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--zhu)}

#print{display:none}

@media (max-width:1100px){
  .consult{grid-template-columns:minmax(0,1fr)}
  .consult>.sg-col{grid-column:1;grid-row:auto;margin-bottom:16px}
  .sg-wrap{position:static;max-height:none}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 14px;overflow-x:auto}
  .side .fine,.brand small{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap;padding:6px 10px}
  main{padding:18px 16px 48px}
  table.list{min-width:680px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sx-row,.rx-add-row,.filt{grid-template-columns:minmax(0,1fr);gap:4px}
  .filt{gap:12px}
  .tl-i{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (max-width:520px){ .g2,.g4{grid-template-columns:minmax(0,1fr)} .span2{grid-column:auto} }

/* 处方笺 / 病历纸：屏幕预览与打印共用 */
.sheet{background:#fff;color:#000;font-size:15px;line-height:1.6}
.sheet .rp-head{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.sheet .rp-head h1{font:28px var(--f-kai);letter-spacing:.2em}
.sheet .rp-head p{font-size:17px;letter-spacing:.6em;margin-top:2px}
.sheet .rp-info{display:flex;flex-wrap:wrap;gap:4px 28px;padding-bottom:8px;border-bottom:1px solid #000}
.sheet .rp-sec{padding:8px 0;border-bottom:1px solid #999;white-space:pre-wrap;word-break:break-word}
.sheet .rp-sec b{margin-right:8px}
.sheet .rp-R{font:italic 700 26px Georgia,serif;margin:10px 0 4px}
.sheet .rp-herbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 20px;padding:4px 12px 16px;min-height:200px;align-content:start;font-size:17px;font-variant-numeric:tabular-nums}
.sheet .rp-herbs small{font-size:12px;margin-left:3px}
.sheet .rp-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;margin-top:22px}
.sheet-img{display:block;width:100%;border:1px solid var(--line);border-radius:4px}
.preview{border:1px solid var(--line);padding:28px 32px;border-radius:4px}
.modal-box.wide{width:min(780px,100%)}
@media (max-width:520px){ .sheet .rp-herbs{grid-template-columns:repeat(2,1fr)} .preview{padding:16px} }
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .app,.modal,.toast{display:none!important}
  #print{display:block}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="seal">医</span><div><b>中医诊疗系统</b><small>门诊工作站</small></div></div>
    <nav class="nav" id="nav">
      <a href="#dashboard" data-nav="dashboard">工作台</a>
      <a href="#consult" data-nav="consult">接诊</a>
      <a href="#patients" data-nav="patients">患者档案</a>
      <a href="#records" data-nav="records">病历统计</a>
      <a href="#library" data-nav="library">方剂与证型</a>
      <a href="#settings" data-nav="settings">设置与备份</a>
    </nav>
    <button type="button" class="side-lock" id="side-lock" data-act="lock-now" hidden>锁定</button>
    <p class="side-sync" id="side-sync" hidden></p>
    <p class="fine">辨证参考与配伍提示仅作辅助，诊断和处方由执业中医师决定。数据只保存在本机浏览器，请定期备份。</p>
  </aside>
  <main id="main"></main>
</div>
<div id="lock" class="lock" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="print" class="sheet"></div>
<datalist id="herb-list"></datalist>
<datalist id="disease-list"></datalist>
<!-- 每次更新程序时把 v 改掉，保证两个文件一起刷新，不会新旧混用 -->
<script src="js/data.js?v=20261118a"></script>
<script src="js/app.js?v=20261118a"></script>
</body>
</html>
